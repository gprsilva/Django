{% extends "base.html" %}

{% block title %}Especialidades{% endblock %}

{% block conteudo %}
<button class="btnAddEsp"><a href="">Adicionar Especialidade</a></button>
{% for especialidade in especialidades %}
<div id="card-esp">
    <p>Nome: {{ especialidade.nome }}</p>
    <p>Descrição: {{ especialidade.descricao }}</p>
    <button><a href="editarE.html">Editar</a></button>
    <button>Excluir</button>
</div>
{% endfor %}
{% endblock %}
