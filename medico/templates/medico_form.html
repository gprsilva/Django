{% extends "base.html" %}

{% block title %}Cadastrar/Editar Médico{% endblock %}

{% block conteudo %}
<h3>{% if object %}Editar Médico{% else %}Novo Médico{% endif %}</h3>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Salvar</button>
    <a href="{% url 'medico_list' %}"><button type="button">Cancelar</button></a>
</form>
{% endblock %}
